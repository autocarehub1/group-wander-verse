apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wandertogether-network-policy
  namespace: travel-app
spec:
  podSelector:
    matchLabels:
      app: wandertogether-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: wandertogether-frontend
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 5000
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow HTTPS for external APIs (Anthropic, SendGrid)
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow database connections
  - to: []
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wandertogether-frontend-network-policy
  namespace: travel-app
spec:
  podSelector:
    matchLabels:
      app: wandertogether-frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 80
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow communication with backend
  - to:
    - podSelector:
        matchLabels:
          app: wandertogether-backend
    ports:
    - protocol: TCP
      port: 80