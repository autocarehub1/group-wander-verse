apiVersion: v1
kind: Secret
metadata:
  name: wandertogether-secrets
  namespace: travel-app
type: Opaque
data:
  # Base64 encoded secrets - replace with actual values
  # echo -n "your-database-url" | base64
  DATABASE_URL: ""
  # echo -n "your-sendgrid-api-key" | base64  
  SENDGRID_API_KEY: ""
  # echo -n "your-anthropic-api-key" | base64
  ANTHROPIC_API_KEY: ""
  # echo -n "your-session-secret" | base64
  SESSION_SECRET: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: travel-app
type: Opaque
data:
  # PostgreSQL connection details
  PGHOST: ""
  PGPORT: "NTQzMg=="  # 5432 in base64
  PGDATABASE: ""
  PGUSER: ""
  PGPASSWORD: ""