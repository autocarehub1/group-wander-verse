apiVersion: apps/v1
kind: Deployment
metadata:
  name: wandertogether-frontend
  namespace: travel-app
  labels:
    app: wandertogether-frontend
    version: v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: wandertogether-frontend
  template:
    metadata:
      labels:
        app: wandertogether-frontend
        version: v1
    spec:
      containers:
      - name: nginx
        image: nginx:1.25-alpine
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        volumeMounts:
        - name: nginx-config
          mountPath: /etc/nginx/nginx.conf
          subPath: nginx.conf
          readOnly: true
        - name: static-files
          mountPath: /usr/share/nginx/html
          readOnly: true
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        securityContext:
          runAsNonRoot: true
          runAsUser: 101
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
      volumes:
      - name: nginx-config
        configMap:
          name: nginx-config
      - name: static-files
        configMap:
          name: frontend-static-files
---
apiVersion: v1
kind: Service
metadata:
  name: wandertogether-frontend
  namespace: travel-app
  labels:
    app: wandertogether-frontend
spec:
  type: ClusterIP
  selector:
    app: wandertogether-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP