# WanderTogether Travel Application - Kubernetes Manifests
# Based on Google Cloud Platform microservices-demo patterns
# Deploy with: kubectl apply -f kubernetes-manifests.yaml

---
apiVersion: v1
kind: Namespace
metadata:
  name: travel-app
  labels:
    name: travel-app
    app: wandertogether-travel-app
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wandertogether-config
  namespace: travel-app
data:
  NODE_ENV: "production"
  # Database configuration will be handled via secrets
  # Redis/Cache configuration
  CACHE_TTL: "3600"
  # Application configuration
  MAX_UPLOAD_SIZE: "10485760"
  SESSION_TIMEOUT: "86400"
---
apiVersion: v1
kind: Secret
metadata:
  name: wandertogether-secrets
  namespace: travel-app
type: Opaque
data:
  # Base64 encoded secrets - replace with actual values
  # echo -n "your-database-url" | base64
  DATABASE_URL: ""
  # echo -n "your-sendgrid-api-key" | base64  
  SENDGRID_API_KEY: ""
  # echo -n "your-anthropic-api-key" | base64
  ANTHROPIC_API_KEY: ""
  # echo -n "your-session-secret" | base64
  SESSION_SECRET: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: travel-app
type: Opaque
data:
  # PostgreSQL connection details
  PGHOST: ""
  PGPORT: "NTQzMg=="  # 5432 in base64
  PGDATABASE: ""
  PGUSER: ""
  PGPASSWORD: ""
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: nginx-config
  namespace: travel-app
data:
  nginx.conf: |
    worker_processes 1;
    error_log /var/log/nginx/error.log warn;
    pid /var/run/nginx.pid;
    
    events {
        worker_connections 1024;
    }
    
    http {
        include /etc/nginx/mime.types;
        default_type application/octet-stream;
        
        log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                        '$status $body_bytes_sent "$http_referer" '
                        '"$http_user_agent" "$http_x_forwarded_for"';
                        
        access_log /var/log/nginx/access.log main;
        
        sendfile on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        types_hash_max_size 2048;
        
        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_proxied any;
        gzip_comp_level 6;
        gzip_types
            application/atom+xml
            application/geo+json
            application/javascript
            application/x-javascript
            application/json
            application/ld+json
            application/manifest+json
            application/rdf+xml
            application/rss+xml
            application/xhtml+xml
            application/xml
            font/eot
            font/otf
            font/ttf
            image/svg+xml
            text/css
            text/javascript
            text/plain
            text/xml;
        
        # Security headers
        add_header X-Frame-Options DENY;
        add_header X-Content-Type-Options nosniff;
        add_header X-XSS-Protection "1; mode=block";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        
        upstream backend {
            server wandertogether-backend:80;
        }
        
        server {
            listen 80;
            server_name _;
            root /usr/share/nginx/html;
            index index.html;
            
            # Security
            server_tokens off;
            
            # Static files with caching
            location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
                expires 1y;
                add_header Cache-Control "public, immutable";
                try_files $uri =404;
            }
            
            # API routes - proxy to backend
            location /api/ {
                proxy_pass http://backend;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_connect_timeout 30s;
                proxy_send_timeout 30s;
                proxy_read_timeout 30s;
            }
            
            # Health check
            location /health {
                proxy_pass http://backend/health;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
            }
            
            # SPA routing - serve index.html for all non-API routes
            location / {
                try_files $uri $uri/ /index.html;
                add_header Cache-Control "no-cache, no-store, must-revalidate";
                add_header Pragma "no-cache";
                add_header Expires "0";
            }
        }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wandertogether-backend
  namespace: travel-app
  labels:
    app: wandertogether-backend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wandertogether-backend
  template:
    metadata:
      labels:
        app: wandertogether-backend
        version: v1
    spec:
      containers:
      - name: server
        image: gcr.io/keen-opus-470223-b7/wandertogether-backend:latest
        ports:
        - name: http-server
          containerPort: 5000
          protocol: TCP
        env:
        - name: PORT
          value: "5000"
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: wandertogether-config
              key: NODE_ENV
        - name: DATABASE_URL
          valueFrom:
            secretKeyRef:
              name: wandertogether-secrets
              key: DATABASE_URL
        - name: SENDGRID_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandertogether-secrets
              key: SENDGRID_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: wandertogether-secrets
              key: ANTHROPIC_API_KEY
        - name: SESSION_SECRET
          valueFrom:
            secretKeyRef:
              name: wandertogether-secrets
              key: SESSION_SECRET
        - name: PGHOST
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: PGHOST
        - name: PGPORT
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: PGPORT
        - name: PGDATABASE
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: PGDATABASE
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: PGUSER
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: postgres-secret
              key: PGPASSWORD
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: wandertogether-backend
  namespace: travel-app
  labels:
    app: wandertogether-backend
spec:
  type: ClusterIP
  selector:
    app: wandertogether-backend
  ports:
  - name: http
    port: 80
    targetPort: 5000
    protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wandertogether-frontend
  namespace: travel-app
  labels:
    app: wandertogether-frontend
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: wandertogether-frontend
  template:
    metadata:
      labels:
        app: wandertogether-frontend
        version: v1
    spec:
      containers:
      - name: nginx
        image: gcr.io/keen-opus-470223-b7/wandertogether-frontend:latest
        ports:
        - name: http
          containerPort: 80
          protocol: TCP
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: wandertogether-frontend
  namespace: travel-app
  labels:
    app: wandertogether-frontend
spec:
  type: ClusterIP
  selector:
    app: wandertogether-frontend
  ports:
  - name: http
    port: 80
    targetPort: 80
    protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wandertogether-ingress
  namespace: travel-app
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "wandertogether-ip"
    ingress.gcp.kubernetes.io/managed-certificates: "wandertogether-ssl-cert"
    kubernetes.io/ingress.allow-http: "false"
    # Enable Cloud CDN for static assets
    cloud.google.com/backend-config: '{"default": "wandertogether-backendconfig"}'
spec:
  rules:
  - host: wandertogether.example.com
    http:
      paths:
      - path: /api/*
        pathType: ImplementationSpecific
        backend:
          service:
            name: wandertogether-backend
            port:
              number: 80
      - path: /*
        pathType: ImplementationSpecific
        backend:
          service:
            name: wandertogether-frontend
            port:
              number: 80
---
apiVersion: networking.gke.io/v1
kind: ManagedCertificate
metadata:
  name: wandertogether-ssl-cert
  namespace: travel-app
spec:
  domains:
    - wandertogether.example.com
---
apiVersion: cloud.google.com/v1
kind: BackendConfig
metadata:
  name: wandertogether-backendconfig
  namespace: travel-app
spec:
  healthCheck:
    checkIntervalSec: 10
    timeoutSec: 5
    healthyThreshold: 1
    unhealthyThreshold: 3
    type: HTTP
    requestPath: /health
  connectionDraining:
    drainingTimeoutSec: 60
  cdn:
    enabled: true
    cachePolicy:
      includeHost: true
      includeProtocol: true
      includeQueryString: false
    negativeCaching: true
    negativeCachingPolicy:
    - code: 404
      ttl: 120
    - code: 410
      ttl: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wandertogether-backend-hpa
  namespace: travel-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wandertogether-backend
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wandertogether-frontend-hpa
  namespace: travel-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wandertogether-frontend
  minReplicas: 1
  maxReplicas: 1
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60
      selectPolicy: Max
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wandertogether-network-policy
  namespace: travel-app
spec:
  podSelector:
    matchLabels:
      app: wandertogether-backend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: wandertogether-frontend
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    ports:
    - protocol: TCP
      port: 5000
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow HTTPS for external APIs (Anthropic, SendGrid)
  - to: []
    ports:
    - protocol: TCP
      port: 443
  # Allow database connections
  - to: []
    ports:
    - protocol: TCP
      port: 5432
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wandertogether-frontend-network-policy
  namespace: travel-app
spec:
  podSelector:
    matchLabels:
      app: wandertogether-frontend
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: ingress-nginx
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 80
  egress:
  # Allow DNS resolution
  - to: []
    ports:
    - protocol: UDP
      port: 53
  # Allow communication with backend
  - to:
    - podSelector:
        matchLabels:
          app: wandertogether-backend
    ports:
    - protocol: TCP
      port: 80
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loadgenerator
  namespace: travel-app
  labels:
    app: loadgenerator
    version: v1
spec:
  selector:
    matchLabels:
      app: loadgenerator
  replicas: 1
  template:
    metadata:
      labels:
        app: loadgenerator
        version: v1
      annotations:
        sidecar.istio.io/rewrite-app-http-probes: "true"
    spec:
      serviceAccountName: default
      terminationGracePeriodSeconds: 5
      restartPolicy: Always
      containers:
      - name: main
        image: gcr.io/keen-opus-470223-b7/wandertogether-loadgenerator:latest
        env:
        - name: FRONTEND_ADDR
          value: "wandertogether-frontend:80"
        - name: USERS
          value: "10"
        - name: SPAWN_RATE
          value: "2"
        - name: LOCUST_WEB_PORT
          value: "8089"
        - name: LOCUST_LOG_LEVEL
          value: "info"
        - name: LOCUST_HOST
          value: "http://wandertogether-frontend"
        resources:
          requests:
            cpu: 300m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        ports:
        - name: web
          containerPort: 8089
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /
            port: 8089
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          successThreshold: 1
          failureThreshold: 3
        livenessProbe:
          httpGet:
            path: /
            port: 8089
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 5

---
apiVersion: v1
kind: Service
metadata:
  name: loadgenerator
  namespace: travel-app
  labels:
    app: loadgenerator
spec:
  type: ClusterIP
  selector:
    app: loadgenerator
  ports:
  - name: web
    port: 8089
    targetPort: 8089
    protocol: TCP
---
apiVersion: v1
kind: Service
metadata:
  name: loadgenerator-external
  namespace: travel-app
  labels:
    app: loadgenerator
spec:
  type: LoadBalancer
  selector:
    app: loadgenerator
  ports:
  - name: web
    port: 80
    targetPort: 8089
    protocol: TCP
