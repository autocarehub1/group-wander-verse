
# k8s/travel-app-all-in-one.yaml
# Complete Kubernetes deployment for Group Wander Verse Build Service

apiVersion: v1
kind: Namespace
metadata:
  name: wanderverse-builds
  labels:
    name: wanderverse-builds
    app: group-wander-verse
    purpose: travel-app-builds

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: wanderverse-config
  namespace: wanderverse-builds
  labels:
    app: wanderverse-builder
data:
  NODE_ENV: "production"
  BUILD_ENV: "production"
  LOG_LEVEL: "info"
  BUILD_TIMEOUT: "1800000"
  MAX_CONCURRENT_BUILDS: "2"
  BUILD_RETENTION_DAYS: "7"
  ARTIFACTS_PATH: "/app/artifacts"

  # Travel App Specific Configuration
  APP_NAME: "Group Wander Verse"
  APP_TYPE: "travel-app"
  SUPPORTED_PLATFORMS: "android,ios,expo"

  # Android Configuration for Travel App
  ANDROID_COMPILE_SDK_VERSION: "33"
  ANDROID_BUILD_TOOLS_VERSION: "33.0.2"
  ANDROID_MIN_SDK_VERSION: "21"
  ANDROID_TARGET_SDK_VERSION: "33"

  # React Native Configuration
  RN_VERSION: "0.72.0"
  EXPO_SDK_VERSION: "49.0.0"

  # Travel Features Configuration
  GOOGLE_MAPS_ENABLED: "true"
  PAYMENT_PROVIDERS: "stripe,paypal"
  NOTIFICATION_PROVIDERS: "firebase,onesignal"

---
apiVersion: v1
kind: Secret
metadata:
  name: wanderverse-secrets
  namespace: wanderverse-builds
  labels:
    app: wanderverse-builder
type: Opaque
stringData:
  # API Keys for Travel App Integration
  google-maps-api-key: "your-google-maps-api-key"
  stripe-publishable-key: "your-stripe-publishable-key"
  stripe-secret-key: "your-stripe-secret-key"
  firebase-api-key: "your-firebase-api-key"
  firebase-project-id: "your-firebase-project-id"

  # Build Service Authentication
  jwt-secret: "your-jwt-secret-for-build-auth"
  api-key: "your-secure-api-key"

  # GitHub Integration
  github-token: "your-github-personal-access-token"
  github-webhook-secret: "your-webhook-secret"

  # Android Signing (Base64 encoded)
  android-keystore: "base64-encoded-keystore-file"
  android-keystore-password: "your-keystore-password"
  android-key-alias: "your-key-alias"
  android-key-password: "your-key-password"

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wanderverse-artifacts-pvc
  namespace: wanderverse-builds
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi  # Larger storage for travel app builds with maps/assets
  storageClassName: standard-rwo

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wanderverse-cache-pvc
  namespace: wanderverse-builds
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi  # Cache for dependencies and build tools
  storageClassName: standard-rwo

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wanderverse-builder
  namespace: wanderverse-builds
  labels:
    app: wanderverse-builder
    version: v1
spec:
  replicas: 1  # Start with 1, can be scaled based on demand
  selector:
    matchLabels:
      app: wanderverse-builder
  template:
    metadata:
      labels:
        app: wanderverse-builder
        version: v1
    spec:
      containers:
      - name: builder
        image: gcr.io/PROJECT_ID_PLACEHOLDER/wanderverse-builder:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        resources:
          requests:
            memory: "1Gi"      # Increased for travel app builds
            cpu: "500m"
            ephemeral-storage: "2Gi"
          limits:
            memory: "4Gi"      # Higher limit for complex travel app builds
            cpu: "2000m"       # 2 CPU cores for faster builds
            ephemeral-storage: "10Gi"

        # Environment variables from ConfigMap
        envFrom:
        - configMapRef:
            name: wanderverse-config

        # Sensitive environment variables from Secret
        env:
        - name: GOOGLE_MAPS_API_KEY
          valueFrom:
            secretKeyRef:
              name: wanderverse-secrets
              key: google-maps-api-key
        - name: STRIPE_PUBLISHABLE_KEY
          valueFrom:
            secretKeyRef:
              name: wanderverse-secrets
              key: stripe-publishable-key
        - name: FIREBASE_API_KEY
          valueFrom:
            secretKeyRef:
              name: wanderverse-secrets
              key: firebase-api-key
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: wanderverse-secrets
              key: jwt-secret
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: wanderverse-secrets
              key: api-key
        - name: GITHUB_TOKEN
          valueFrom:
            secretKeyRef:
              name: wanderverse-secrets
              key: github-token
        - name: ANDROID_KEYSTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: wanderverse-secrets
              key: android-keystore-password

        # Volume mounts for persistent storage
        volumeMounts:
        - name: artifacts-storage
          mountPath: /app/artifacts
        - name: cache-storage
          mountPath: /app/cache
        - name: build-cache
          mountPath: /app/build-cache
        - name: android-sdk-cache
          mountPath: /opt/android-sdk-cache

        # Health checks optimized for travel app builds
        livenessProbe:
          httpGet:
            path: /health/live
            port: 3000
          initialDelaySeconds: 90    # Longer startup time for travel app
          periodSeconds: 30
          timeoutSeconds: 15
          failureThreshold: 3

        readinessProbe:
          httpGet:
            path: /health/ready
            port: 3000
          initialDelaySeconds: 60
          periodSeconds: 15
          timeoutSeconds: 10
          failureThreshold: 3

        startupProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 18        # 3 minutes for startup

      volumes:
      - name: artifacts-storage
        persistentVolumeClaim:
          claimName: wanderverse-artifacts-pvc
      - name: cache-storage
        persistentVolumeClaim:
          claimName: wanderverse-cache-pvc
      - name: build-cache
        emptyDir:
          sizeLimit: 5Gi
      - name: android-sdk-cache
        emptyDir:
          sizeLimit: 3Gi

      # Use preemptible nodes for cost savings
      nodeSelector:
        cloud.google.com/gke-preemptible: "true"

      tolerations:
      - key: "preemptible"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"

      # Graceful shutdown for builds in progress
      terminationGracePeriodSeconds: 300  # 5 minutes to finish builds

      # Security context
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000

---
apiVersion: v1
kind: Service
metadata:
  name: wanderverse-builder-service
  namespace: wanderverse-builds
  labels:
    app: wanderverse-builder
spec:
  selector:
    app: wanderverse-builder
  ports:
  - name: http
    port: 80
    targetPort: 3000
    protocol: TCP
  - name: metrics
    port: 9090
    targetPort: 9090
    protocol: TCP
  type: ClusterIP

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wanderverse-builder-ingress
  namespace: wanderverse-builds
  labels:
    app: wanderverse-builder
  annotations:
    kubernetes.io/ingress.class: "gce"
    kubernetes.io/ingress.global-static-ip-name: "wanderverse-builder-ip"
    ingress.gcp.kubernetes.io/managed-certificates: "wanderverse-ssl-cert"
    kubernetes.io/ingress.allow-http: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"  # Allow large file uploads
    nginx.ingress.kubernetes.io/proxy-read-timeout: "1800"  # 30 min timeout for builds
spec:
  rules:
  - host: builder.wanderverse.app  # Change to your domain
    http:
      paths:
      - path: "/*"
        pathType: ImplementationSpecific
        backend:
          service:
            name: wanderverse-builder-service
            port:
              number: 80

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: wanderverse-builder-hpa
  namespace: wanderverse-builds
  labels:
    app: wanderverse-builder
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: wanderverse-builder
  minReplicas: 1
  maxReplicas: 3  # Limited for cost control
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 600  # 10 minutes before scaling down
      policies:
      - type: Percent
        value: 25
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 120  # 2 minutes before scaling up
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60

---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: wanderverse-cleanup
  namespace: wanderverse-builds
  labels:
    app: wanderverse-builder
spec:
  schedule: "0 2 * * *"  # Run daily at 2 AM
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cleanup
            image: gcr.io/PROJECT_ID_PLACEHOLDER/wanderverse-builder:latest
            command: ["/bin/bash", "-c"]
            args:
            - |
              echo "Starting cleanup of old travel app builds..."
              # Cleanup logic would be implemented here
              # This could call an API endpoint or run cleanup directly
              curl -X POST http://wanderverse-builder-service/api/v1/admin/cleanup
            env:
            - name: API_KEY
              valueFrom:
                secretKeyRef:
                  name: wanderverse-secrets
                  key: api-key
          restartPolicy: OnFailure

---
# Network Policy for security
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wanderverse-builder-netpol
  namespace: wanderverse-builds
spec:
  podSelector:
    matchLabels:
      app: wanderverse-builder
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    - podSelector: {}
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - {}  # Allow all outbound traffic for API calls, downloads, etc.