name: Deploy to Kubernetes

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'docs/**'
      - '*.md'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
        - staging
        - production

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  GKE_CLUSTER: wandertogether-cluster
  GKE_REGION: us-central1
  IMAGE_BACKEND: wandertogether-backend
  IMAGE_FRONTEND: wandertogether-frontend

jobs:
  setup-build-publish-deploy:
    name: Setup, Build, Publish, and Deploy
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment || 'staging' }}
    
    permissions:
      contents: read
      id-token: write

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Alternative to service account key - use Workload Identity Federation
    - name: 'Authenticate to Google Cloud'
      uses: 'google-github-actions/auth@v2'
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}

    # Setup gcloud CLI
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v2

    # Configure Docker to use gcloud as a credential helper for GCR
    - name: Configure Docker
      run: |-
        gcloud --quiet auth configure-docker gcr.io

    # Get the GKE credentials so we can deploy to the cluster
    - name: Set up GKE credentials
      run: |-
        gcloud container clusters get-credentials "$GKE_CLUSTER" --region "$GKE_REGION"

    # Build the Docker images
    - name: Build Backend Image
      run: |-
        docker build \
          --tag "gcr.io/$PROJECT_ID/$IMAGE_BACKEND:$GITHUB_SHA" \
          --tag "gcr.io/$PROJECT_ID/$IMAGE_BACKEND:latest" \
          .

    - name: Build Frontend Image
      run: |-
        docker build \
          --file Dockerfile.frontend \
          --tag "gcr.io/$PROJECT_ID/$IMAGE_FRONTEND:$GITHUB_SHA" \
          --tag "gcr.io/$PROJECT_ID/$IMAGE_FRONTEND:latest" \
          .

    - name: Build Loadgenerator Image
      run: |-
        docker build \
          --file Dockerfile.loadgenerator \
          --tag "gcr.io/$PROJECT_ID/wandertogether-loadgenerator:$GITHUB_SHA" \
          --tag "gcr.io/$PROJECT_ID/wandertogether-loadgenerator:latest" \
          .

    # Push the Docker images to Google Container Registry
    - name: Push Backend Image
      run: |-
        docker push "gcr.io/$PROJECT_ID/$IMAGE_BACKEND:$GITHUB_SHA"
        docker push "gcr.io/$PROJECT_ID/$IMAGE_BACKEND:latest"

    - name: Push Frontend Image
      run: |-
        docker push "gcr.io/$PROJECT_ID/$IMAGE_FRONTEND:$GITHUB_SHA"
        docker push "gcr.io/$PROJECT_ID/$IMAGE_FRONTEND:latest"

    - name: Push Loadgenerator Image
      run: |-
        docker push "gcr.io/$PROJECT_ID/wandertogether-loadgenerator:$GITHUB_SHA"
        docker push "gcr.io/$PROJECT_ID/wandertogether-loadgenerator:latest"

    # Set up Kustomize
    - name: Set up Kustomize
      run: |-
        curl -sfLo kustomize https://github.com/kubernetes-sigs/kustomize/releases/download/v3.1.0/kustomize_3.1.0_linux_amd64
        chmod u+x ./kustomize

    # Deploy the application to GKE
    - name: Deploy
      run: |-
        # Replace PROJECT_ID placeholder in kustomization.yaml
        sed -i.bak "s/PROJECT_ID/$PROJECT_ID/g" kubernetes/kustomization.yaml
        
        # Set the image tags to the current commit SHA
        ./kustomize edit set image gcr.io/PROJECT_ID/wandertogether-backend=gcr.io/$PROJECT_ID/$IMAGE_BACKEND:$GITHUB_SHA
        ./kustomize edit set image gcr.io/PROJECT_ID/wandertogether-frontend=gcr.io/$PROJECT_ID/$IMAGE_FRONTEND:$GITHUB_SHA
        
        # Apply the kustomized configuration
        ./kustomize build kubernetes/ | kubectl apply -f -
        
        # Verify deployment
        kubectl rollout status deployment/wandertogether-backend -n travel-app
        kubectl rollout status deployment/wandertogether-frontend -n travel-app
        
        # Get the external IP
        kubectl get services -o wide -n travel-app

    # Slack notification on success
    - name: Slack Notification - Success
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        channel: '#deployments'
        text: |
          ✅ *WanderTogether* deployed successfully to *${{ github.event.inputs.environment || 'staging' }}*
          
          *Commit:* `${{ github.sha }}`
          *Author:* ${{ github.actor }}
          *Branch:* ${{ github.ref_name }}
          
          View deployment: `kubectl get pods -n wandertogether`
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

    # Slack notification on failure
    - name: Slack Notification - Failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        channel: '#deployments'
        text: |
          ❌ *WanderTogether* deployment failed to *${{ github.event.inputs.environment || 'staging' }}*
          
          *Commit:* `${{ github.sha }}`
          *Author:* ${{ github.actor }}
          *Branch:* ${{ github.ref_name }}
          
          Check logs: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: setup-build-publish-deploy
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        scan-type: 'fs'
        scan-ref: '.'
        format: 'sarif'
        output: 'trivy-results.sarif'
        
    - name: Upload Trivy scan results to GitHub Security tab
      uses: github/codeql-action/upload-sarif@v2
      if: always()
      with:
        sarif_file: 'trivy-results.sarif'