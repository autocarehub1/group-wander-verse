steps:
  # Build step with comprehensive error handling
  - name: 'node:20'
    entrypoint: 'bash'
    args: 
      - '-c'
      - |
        set -x  # Enable debug output
        
        echo "=== Node.js App Engine Build ==="
        echo "Node: $(node --version)"
        echo "NPM: $(npm --version)"
        echo "PWD: $(pwd)"
        echo "Files: $(ls -la)"
        
        # Check package.json exists and is readable
        if [ ! -f package.json ]; then
          echo "ERROR: package.json not found"
          exit 1
        fi
        
        echo "Package.json content (first 20 lines):"
        head -20 package.json
        
        # Clean install to fix optional dependency issues
        echo "=== Cleaning and Installing Dependencies ==="
        rm -rf node_modules package-lock.json || true
        npm cache clean --force || true
        npm install --production=false --no-optional 2>&1 | tee install.log
        
        # Check install success
        if [ $$? -ne 0 ]; then
          echo "ERROR: npm install failed"
          echo "Install log tail:"
          tail -20 install.log
          exit 1
        fi
        
        echo "=== Checking Node Modules ==="
        ls -la node_modules/.bin/ | head -10
        
        # Force install all rollup platform binaries to avoid missing dependencies
        echo "=== Installing Rollup Binaries ==="
        npm install @rollup/rollup-linux-x64-gnu @rollup/rollup-linux-arm64-gnu @rollup/rollup-linux-x64-musl --no-save || true
        
        # Try builds with full error capture
        echo "=== Building Client ==="
        npx vite build --mode production 2>&1 | tee vite.log
        VITE_STATUS=$$?
        
        if [ $$VITE_STATUS -ne 0 ]; then
          echo "ERROR: Vite build failed (exit code: $$VITE_STATUS)"
          echo "Vite log:"
          cat vite.log
          exit 1
        fi
        
        echo "=== Building Server ==="
        npx esbuild server/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist 2>&1 | tee esbuild.log
        ESBUILD_STATUS=$$?
        
        if [ $$ESBUILD_STATUS -ne 0 ]; then
          echo "ERROR: ESBuild failed (exit code: $$ESBUILD_STATUS)"
          echo "ESBuild log:"
          cat esbuild.log
          exit 1
        fi
        
        echo "=== Verifying Build Outputs ==="
        echo "Contents of dist/:"
        ls -la dist/ 2>/dev/null || echo "No dist directory found"
        
        echo "Contents of root directory after build:"
        find . -name "*.js" -o -name "index.html" -o -name "dist" -type f,d | head -20
        
        echo "Looking for build outputs:"
        echo "- Server build (dist/index.js): $$(test -f dist/index.js && echo "✓ Found" || echo "✗ Missing")"
        echo "- Client build outputs:"
        find dist/ -name "*.html" -o -name "*.js" -o -name "*.css" | head -10 2>/dev/null || echo "No client build files found"
        
        # Update verification to match actual Vite output structure
        if [ ! -f dist/index.js ]; then
          echo "ERROR: Server build missing - dist/index.js not found"
          exit 1
        fi
        
        # Check for any client build output files instead of specific directory
        CLIENT_FILES=$$(find dist/ -name "index.html" -o -name "*.js" -o -name "*.css" | wc -l)
        if [ "$$CLIENT_FILES" -eq 0 ]; then
          echo "ERROR: Client build missing - no client files found in dist/"
          exit 1
        fi
        
        echo "Found $$CLIENT_FILES client build files"
        
        # Create minimal production package.json to avoid build issues in App Engine
        echo "=== Creating Production Configuration ==="
        cp package.prod.json package.json
        rm -f package-lock.json
        
        echo "✅ Build completed successfully"
  
  # Deploy to App Engine
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['app', 'deploy', 'app.engine.yaml', '--quiet']

timeout: '1800s'

options:
  logging: CLOUD_LOGGING_ONLY