steps:
  # Single step: install, build, and verify
  - name: 'node:20'
    entrypoint: 'bash'
    args: 
      - '-c'
      - |
        # Install and build in single step to avoid state issues
        echo "=== Node.js App Engine Build ==="
        echo "Node: $(node --version) | NPM: $(npm --version)"
        
        # Install all dependencies including devDependencies
        npm install --cache /tmp/.npm --production=false
        
        # Debug: Check if build tools exist
        echo "Checking build tools..."
        npx vite --version || echo "Vite not found"
        npx esbuild --version || echo "ESBuild not found"
        
        # Build with explicit tool paths
        echo "Building client..."
        npx vite build --mode production || exit 1
        echo "Building server..."
        npx esbuild server/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist || exit 1
        
        # Verify build outputs
        test -f dist/index.js || (echo "Server build missing" && exit 1)
        test -d dist/public || (echo "Client build missing" && exit 1)
        
        echo "✅ Build successful - ready for deployment"
  
  # Deploy to App Engine
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['app', 'deploy', 'app.engine.yaml', '--quiet']

timeout: '1800s'
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY