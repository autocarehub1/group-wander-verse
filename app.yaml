steps:
  # Build step with comprehensive error handling
  - name: 'node:20'
    entrypoint: 'bash'
    args: 
      - '-c'
      - |
        set -x  # Enable debug output
        
        echo "=== Node.js App Engine Build ==="
        echo "Node: $(node --version)"
        echo "NPM: $(npm --version)"
        echo "PWD: $(pwd)"
        echo "Files: $(ls -la)"
        
        # Check package.json exists and is readable
        if [ ! -f package.json ]; then
          echo "ERROR: package.json not found"
          exit 1
        fi
        
        echo "Package.json content (first 20 lines):"
        head -20 package.json
        
        # Install with verbose output to see what's happening
        echo "=== Installing Dependencies ==="
        npm install --verbose --production=false 2>&1 | tee install.log
        
        # Check install success
        if [ $? -ne 0 ]; then
          echo "ERROR: npm install failed"
          echo "Install log tail:"
          tail -20 install.log
          exit 1
        fi
        
        echo "=== Checking Node Modules ==="
        ls -la node_modules/.bin/ | head -10
        
        # Try builds with full error capture
        echo "=== Building Client ==="
        npx vite build --mode production 2>&1 | tee vite.log
        VITE_EXIT=$?
        
        if [ $VITE_EXIT -ne 0 ]; then
          echo "ERROR: Vite build failed (exit code: $VITE_EXIT)"
          echo "Vite log:"
          cat vite.log
          exit 1
        fi
        
        echo "=== Building Server ==="
        npx esbuild server/index.ts --platform=node --packages=external --bundle --format=esm --outdir=dist 2>&1 | tee esbuild.log
        ESBUILD_EXIT=$?
        
        if [ $ESBUILD_EXIT -ne 0 ]; then
          echo "ERROR: ESBuild failed (exit code: $ESBUILD_EXIT)"
          echo "ESBuild log:"
          cat esbuild.log
          exit 1
        fi
        
        echo "=== Verifying Build Outputs ==="
        ls -la dist/
        
        if [ ! -f dist/index.js ]; then
          echo "ERROR: Server build missing - dist/index.js not found"
          exit 1
        fi
        
        if [ ! -d dist/public ]; then
          echo "ERROR: Client build missing - dist/public/ not found"
          exit 1
        fi
        
        echo "✅ Build completed successfully"
  
  # Deploy to App Engine
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['app', 'deploy', 'app.engine.yaml', '--quiet']

timeout: '1800s'
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY