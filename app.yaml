steps:
  - name: 'gcr.io/cloud-builders/npm'
    args: ['ci', '--production=false']
  - name: 'gcr.io/cloud-builders/npm'
    args: ['run', 'build']
  - name: 'gcr.io/cloud-builders/gcloud'
    args: ['app', 'deploy', 'app.engine.yaml', '--quiet']
timeout: '2400s'
options:
  machineType: 'E2_HIGHCPU_8'