steps:
# Build backend image
- name: 'gcr.io/cloud-builders/docker'
  args: 
  - 'build'
  - '-t'
  - 'gcr.io/keen-opus-470223-b7/wandertogether-backend:latest'
  - '-t' 
  - 'gcr.io/keen-opus-470223-b7/wandertogether-backend:$BUILD_ID'
  - '.'
  id: 'build-backend'

# Build frontend image
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '-f'
  - 'Dockerfile.frontend'
  - '-t'
  - 'gcr.io/keen-opus-470223-b7/wandertogether-frontend:latest'
  - '-t'
  - 'gcr.io/keen-opus-470223-b7/wandertogether-frontend:$BUILD_ID'
  - '.'
  id: 'build-frontend'

# Build loadgenerator image
- name: 'gcr.io/cloud-builders/docker'
  args:
  - 'build'
  - '-f'
  - 'Dockerfile.loadgenerator'
  - '-t'
  - 'gcr.io/keen-opus-470223-b7/wandertogether-loadgenerator:latest'
  - '-t'
  - 'gcr.io/keen-opus-470223-b7/wandertogether-loadgenerator:$BUILD_ID'
  - '.'
  id: 'build-loadgenerator'

# Push all images
images:
- 'gcr.io/keen-opus-470223-b7/wandertogether-backend:latest'
- 'gcr.io/keen-opus-470223-b7/wandertogether-backend:$BUILD_ID'
- 'gcr.io/keen-opus-470223-b7/wandertogether-frontend:latest'
- 'gcr.io/keen-opus-470223-b7/wandertogether-frontend:$BUILD_ID'
- 'gcr.io/keen-opus-470223-b7/wandertogether-loadgenerator:latest'
- 'gcr.io/keen-opus-470223-b7/wandertogether-loadgenerator:$BUILD_ID'

options:
  machineType: 'E2_HIGHCPU_8'
  
timeout: '1200s'